<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="glassSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38d6fa" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#1898f8" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#0438b8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#02144a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glare" cx="30%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silkWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8c880" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d13448" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0438b8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background ripple glow -->
  <circle cx="32" cy="32" r="30" fill="url(#silkWave)" opacity="0.35"/>

  <!-- Liquid Glass Sphere Body -->
  <circle cx="32" cy="32" r="26" fill="url(#glassSphere)"/>

  <!-- Specular Glare Arc -->
  <circle cx="32" cy="32" r="26" fill="url(#glare)"/>

  <!-- Crystalline Rim Highlight -->
  <circle cx="32" cy="32" r="25.5" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
  <circle cx="32" cy="32" r="24.5" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="0.8"/>
</svg>
